<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Gradescope OCR Overlay</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Gradescope OCR Overlay</h1>
      <p id="status">Checking bundled OCR index...</p>
      <dl>
        <dt>Pages</dt>
        <dd id="pages">-</dd>
        <dt>Submissions</dt>
        <dd id="submissions">-</dd>
        <dt>Generated</dt>
        <dd id="generated">-</dd>
      </dl>
      <p class="hint">Open a Gradescope grading or answer-group page and the OCR panel appears automatically.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
