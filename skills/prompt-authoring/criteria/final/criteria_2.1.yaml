# Grading spec — see reference/spec-template.yaml.
# `criteria` is generated by the script.
exam: Final
id: '2.1'
criteria:
- id: marginal_effect_not_constant
  question: Does the student state that the marginal effect of firm size (sales) on
    rdintens is NOT constant (i.e., it changes with firm size)?
  accept:
  - Not constant; it changes with firm size.
  - The marginal effect varies with sales.
  - The effect depends on the level of sales, so it is not constant.
  - It changes with firm size because the derivative depends on sales.
  reject:
  - The marginal effect IS constant.
  - It does not change with firm size.
  - Student correctly rejects H0 but then states the marginal effect is constant as
    their final answer (e.g., student 25, 52, 111).
- id: justification_mentions_quadratic_or_derivative
  question: Does the student justify the non-constancy by referencing the quadratic
    term (sales²), the nonlinearity of the model, or by computing a derivative that
    depends on sales?
  accept:
  - Because of the sales² term, the derivative depends on sales.
  - Taking d(rdintens)/d(sales) = 0.301 − 0.014·sales, which includes sales.
  - The model is quadratic so the marginal effect is not constant.
  - The slope changes with sales because there is a sales² regressor.
  - The rate of change is not constant because it is a quadratic equation.
  reject:
  - Student merely asserts 'not constant' with no reasoning or derivation.
  - Student restates the regression equation but does not explain why the marginal
    effect changes.
- id: derivative_retains_sales_variable
  question: When the student computes the marginal effect (derivative of rdintens
    w.r.t. sales), does the resulting expression retain sales as a variable rather
    than being collapsed to a single number?
  accept:
  - 0.301 − 0.014·sales
  - 0.301 − 2(0.0070)·sales
  - β₁ + 2β₂·sales with values substituted but sales kept as a variable
  reject:
  - Student writes 0.301 − 2(0.0070) = 0.287 (drops the sales variable, giving a single
    constant).
  - Student writes only 0.301 as the marginal effect (ignoring the quadratic correction
    term entirely).
- id: null_hypothesis_targets_beta2
  question: 'Does the student set up the null hypothesis as: the coefficient on sales²
    (β₂ ≈ −0.0070) equals zero?'
  accept:
  - 'H₀: β₂ = 0'
  - 'H₀: β_{sales²} = 0'
  - 'H₀: sales² = 0 (informal but clearly refers to its coefficient)'
  - 'Null: the quadratic coefficient is zero.'
  - 'H₀ is vague (e.g., ''H₀: β = 0'') but the student''s t-statistic is 0.0070/0.0033,
    showing they are testing β₂.'
  reject:
  - 'Student explicitly sets up H₀: β₁ = 0 (coefficient on sales = 0.301) AND uses
    0.301/0.131 ≈ 2.30 as the t-statistic.'
  - Student explicitly tests only the intercept β₀.
- id: two_sided_alternative
  question: Does the student use a two-sided alternative hypothesis (β₂ ≠ 0)?
  accept:
  - 'H₁: β₂ ≠ 0'
  - Two-tailed test at 5% significance.
  - Any answer where the alternative is ≠ 0.
  - Student does not state H₁ explicitly but uses CV = 1.96, implying a two-tailed
    test.
  reject:
  - REJECT only if the student explicitly states a one-sided alternative (> or <)
    AND uses a one-tailed critical value (e.g., 1.645) that changes the reject/fail-to-reject
    decision compared with the two-tailed test.
- id: t_statistic_approx_2pt12
  question: Does the student compute a t-statistic of approximately ±2.12 (= |0.0070
    / 0.0033|)?
  accept:
  - t = 2.12
  - t = −2.12
  - t ≈ 2.121
  - t = 0.070/0.033 = 2.12 (OCR dropped leading zeros but same ratio)
  - Any value whose absolute value is between 2.10 and 2.15
  reject:
  - t ≈ 2.30 (used 0.301/0.131, wrong coefficient)
  - t ≈ 4.24 (used 0.014/0.0033, doubled the numerator)
  - t ≈ 21 (used wrong SE such as 0.00033)
  - t ≈ −0.148 (used wrong SE such as 0.0035)
  - Any value whose absolute value is not close to 2.12 and cannot be attributed to
    rounding or OCR error
- id: correct_critical_value
  question: Does the student use a critical value of approximately 1.96 for the two-tailed
    5% significance test?
  accept:
  - CV = 1.96
  - ±1.96
  - Critical value at 5% two-tailed = 1.96
  - Student compares t = 2.12 to 1.96 (implicit use of 1.96)
  reject:
  - REJECT only if the student uses a clearly wrong critical value (e.g., 1.645 for
    a one-tailed test) AND that wrong value changes their reject/fail-to-reject conclusion
    relative to the correct 1.96.
- id: rejects_null_hypothesis
  question: Does the student correctly reject H₀ (i.e., conclude that the null hypothesis
    is rejected at the 5% significance level)?
  accept:
  - Reject H₀ / reject the null.
  - Statistically significant at the 5% level.
  - '|t| = 2.12 > 1.96, so reject.'
  - The result is significant; reject the null.
  reject:
  - Student explicitly states 'fail to reject H₀'.
  - Student explicitly states 'cannot reject H₀'.
  - Student states 'not statistically significant'.
  - Student correctly computes t ≈ 2.12 > 1.96 but then explicitly concludes 'fail
    to reject' (e.g., students 38, 40, 59, 76).
- id: correct_final_conclusion
  question: Does the student conclude (as a final answer) that the marginal effect
    of firm size on rdintens changes with firm size (is not constant)?
  accept:
  - The marginal effect changes with firm size.
  - The marginal effect is not constant.
  - rdintens changes with firm size (sales).
  - The coefficient on sales² is statistically significant, so the marginal effect
    varies with firm size.
  reject:
  - Student's final statement is that the marginal effect IS constant.
  - Student says the marginal effect does not change with firm size.
  - Student rejects H₀ but then writes 'the marginal effect is constant' as the conclusion.
- id: no_wrong_coefficient_test
  question: Does the student avoid the error of testing the coefficient on sales (β₁
    ≈ 0.301, SE ≈ 0.131, t ≈ 2.30) as their primary test for whether the marginal
    effect is constant?
  accept:
  - Student tests β₂ (the sales² coefficient) with t ≈ 2.12.
  - Student uses 0.0070/0.0033 as the t-statistic.
  reject:
  - REJECT only if the student clearly and primarily uses 0.301/0.131 ≈ 2.30 (or 2.298–2.30)
    as their t-statistic to decide whether the marginal effect is constant, without
    also correctly testing β₂.
- id: no_doubled_numerator_error
  question: Does the student avoid the error of placing the derivative coefficient
    2×0.0070 = 0.014 in the numerator of the t-statistic (which yields t ≈ 4.24 instead
    of the correct ≈ 2.12)?
  accept:
  - t ≈ 2.12 (uses 0.0070 as the numerator)
  - Any t-statistic not approximately equal to 4.24 in absolute value
  reject:
  - REJECT only if the student clearly computes 0.014/0.0033 ≈ 4.24 as their t-statistic,
    having placed the derivative coefficient (0.014) rather than the regression coefficient
    (0.0070) in the numerator.
