# Grading spec — see reference/spec-template.yaml.
# `criteria` is generated by the script.
exam: Final
id: '4.3'
criteria:
- id: connects_question_to_interaction
  number: 1
  question: 'C1: Does the answer recognize that the relevant parameter is the coefficient on the minority-by-female interaction term (min_fem)?'
  accept:
  - States that the coefficient on min_fem or minority*female is the coefficient to test.
  - Explains that the female-male difference is beta_female plus beta_min_fem times minority.
  - Says the interaction term determines whether the gender gap depends on minority status.
  reject:
  - Tests only the minority main effect or only the female main effect.
  - Treats the question as asking whether minority status affects evaluations in general.
  - Uses a product of the separate minority and female coefficients instead of the interaction coefficient.

- id: correct_null_no_interaction
  number: 2
  question: 'C2: Does the answer state the null hypothesis as beta_min_fem = 0?'
  accept:
  - H0 beta_min_fem = 0.
  - H0 the coefficient on minority*female is zero.
  - H0 the difference between female and male instructors average evaluations does not depend on minority status.
  reject:
  - H0 beta_minority = 0 or H0 beta_female = 0.
  - H0 compares beta_female to beta_min_fem or to the intercept.
  - H0 says the female-male gap does depend on minority status.

- id: correct_two_sided_alternative
  number: 3
  question: 'C3: Does the answer state the alternative hypothesis as beta_min_fem not equal to 0 (two-sided)?'
  accept:
  - Ha beta_min_fem not equal to 0.
  - Ha the coefficient on minority*female is not zero.
  - Ha the female-male evaluation difference depends on minority status.
  reject:
  - Uses a one-sided alternative such as beta_min_fem > 0 or beta_min_fem < 0 without justification.
  - Uses an alternative about the minority main effect or female main effect only.
  - States the alternative as no dependence or no interaction.

- id: uses_interaction_regression_row
  number: 4
  question: 'C4: Does the answer use the min_fem row from the interaction model output, rather than a main-effect row or the initial model?'
  accept:
  - Uses the reported min_fem coefficient, standard error, t-statistic, p-value, or confidence interval.
  - Refers to the row for min_fem, minority*female, or the interaction term in the second regression.
  - Uses the displayed interaction coefficient and robust standard error to form the test.
  reject:
  - Bases the test on the minority row, female row, beauty row, onecredit row, or the first regression.
  - Uses the F-statistic for the whole regression as the requested test statistic.
  - Computes the interaction by multiplying the separate minority and female coefficient estimates.

- id: correct_t_statistic
  number: 5
  question: 'C5: Does the answer compute or report the correct t-statistic for testing beta_min_fem = 0 (approximately -2.12)?'
  accept:
  - Reports or computes t approximately equal to -2.12 or 2.12.
  - Computes t = estimated beta_min_fem divided by SE(beta_min_fem).
  - Reads t = -2.12 directly from the min_fem row of the table.
  - Gives a numerically equivalent t-statistic after minor rounding.
  reject:
  - Reports the coefficient itself as the t-statistic.
  - Uses the t-statistic for minority, female, onecredit, beauty, or the overall regression.
  - Gives a substantially different statistic that cannot be attributed to rounding or OCR error.

- id: correct_five_percent_rule
  number: 6
  question: 'C6: Does the answer correctly apply the 5% two-sided decision rule (e.g. |t| > 1.96, p < 0.05, or CI excludes zero)?'
  accept:
  - Uses absolute value of t greater than approximately 1.96.
  - Uses the min_fem p-value of 0.035 and compares it to 0.05.
  - Uses the min_fem 95% confidence interval and notes that it excludes zero.
  reject:
  - Treats a negative t-statistic as non-rejection merely because it is less than the positive critical value.
  - Uses a 1% rule, an F critical value, or another threshold that changes the decision.
  - Compares a p-value to 1 or 0.5 instead of 0.05.

- id: rejects_no_interaction_null
  number: 7
  question: 'C7: Does the answer correctly reject the null hypothesis at the 5% significance level?'
  accept:
  - Reject H0 at the 5% level.
  - The interaction term is statistically significant at 5%, so reject the null.
  - The null of no dependence or no interaction is rejected.
  reject:
  - Fails to reject H0.
  - Says the test is not statistically significant.
  - Gives both reject and fail-to-reject without making a clear correct decision.

- id: concludes_evidence_of_dependence
  number: 8
  question: 'C8: Does the answer conclude that there is evidence at the 5% level that the female-male evaluation gap depends on minority status?'
  accept:
  - There is evidence that the female-male evaluation gap depends on minority status.
  - The difference in average course evaluations between female and male instructors varies by minority status.
  - Yes, at the 5% level the gender gap in course evaluations depends on minority status.
  reject:
  - Concludes there is no evidence that the female-male gap depends on minority status.
  - Concludes the gap does not depend on minority status.
  - Only says there is some difference between female and male instructors without linking to minority status.

- id: keeps_requested_scope_clear
  number: 9
  question: 'C9: Does the interpretation stay focused on the gender gap in course evaluations by minority status, rather than switching to a different outcome or main-effect claim?'
  accept:
  - Interprets the result as a minority-status difference in the female-versus-male course evaluation gap.
  - Mentions course evaluations, female versus male instructors, and minority status in the final interpretation.
  - Uses equivalent plain language such as gender gap in teaching evaluations varies by minority status.
  reject:
  - Interprets the result as a tenure, earnings, career outcome, or student-performance result.
  - Concludes only that minority instructors differ from white instructors or that female instructors differ from male instructors.
  - States only that race and gender are related or significant without tying it to the requested gender-gap dependence.
