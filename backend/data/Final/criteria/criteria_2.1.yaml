# Grading spec — see reference/spec-template.yaml.
# `criteria` is generated by the script.
exam: Final
id: '2.1'
criteria:
- id: marginal_effect_not_constant
  number: 1
  question: 'C1: Does the student state that the marginal effect of firm size (sales) on rdintens is NOT constant?'
  accept:
  - Not constant; it changes with firm size.
  - The marginal effect varies with sales.
  - The effect depends on the level of sales, so it is not constant.
  - It changes with firm size because the derivative depends on sales.
  reject:
  - The marginal effect IS constant.
  - It does not change with firm size.
  - Student correctly rejects H0 but then states the marginal effect is constant as their final answer.

- id: justification_mentions_quadratic_or_derivative
  number: 2
  question: 'C2: Does the student justify the non-constancy by referencing the quadratic term (sales squared), the nonlinearity of the model, or by computing a derivative that depends on sales?'
  accept:
  - Because of the sales squared term, the derivative depends on sales.
  - Taking d(rdintens)/d(sales) = 0.301 minus 0.014 times sales, which includes sales.
  - The model is quadratic so the marginal effect is not constant.
  - The slope changes with sales because there is a sales-squared regressor.
  - The rate of change is not constant because it is a quadratic equation.
  reject:
  - Student merely asserts not constant with no reasoning or derivation.
  - Student restates the regression equation but does not explain why the marginal effect changes.

- id: derivative_retains_sales_variable
  number: 3
  question: 'C3: Does the student either write a derivative that retains sales as a variable, OR set up the correct hypothesis test on beta2 (the sales-squared coefficient), demonstrating understanding that non-constancy is driven by the quadratic term?'
  accept:
  - 0.301 minus 0.014 times sales (derivative retains sales as a variable).
  - 0.301 minus 2 times 0.0070 times sales.
  - beta1 plus 2 times beta2 times sales with values substituted but sales kept as a variable.
  - Student does not write the derivative but sets up H0 beta2 = 0 and computes t = 0.0070/0.0033, implying correct understanding.
  reject:
  - Student writes 0.301 minus 2 times 0.0070 = 0.287 (drops the sales variable) AND does not correctly test beta2.
  - Student writes only 0.301 as the marginal effect AND does not correctly test beta2.

- id: null_hypothesis_targets_beta2
  number: 4
  question: 'C4: Does the student set up the null hypothesis as the coefficient on sales-squared (beta2 approx -0.0070) equals zero?'
  accept:
  - 'H0: beta2 = 0'
  - 'H0: beta_sales_squared = 0'
  - Null is that the quadratic coefficient is zero.
  - H0 is vague but the student uses t = 0.0070/0.0033, showing they are testing beta2.
  reject:
  - Student explicitly sets up H0 for beta1 (coefficient on sales = 0.301) AND uses 0.301/0.131 as the t-statistic.
  - Student explicitly tests only the intercept beta0.

- id: two_sided_alternative
  number: 5
  question: 'C5: Does the student use a two-sided alternative hypothesis (beta2 not equal to 0)?'
  accept:
  - 'H1: beta2 not equal to 0'
  - Two-tailed test at 5% significance.
  - Student does not state H1 explicitly but uses CV = 1.96, implying a two-tailed test.
  reject:
  - REJECT only if the student explicitly states a one-sided alternative AND uses a one-tailed critical value (e.g. 1.645) that changes the reject/fail-to-reject decision.

- id: t_statistic_approx_2pt12
  number: 6
  question: 'C6: Does the student compute a t-statistic of approximately plus or minus 2.12 (= |0.0070 / 0.0033|)?'
  accept:
  - t = 2.12
  - t = minus 2.12
  - t approximately 2.121
  - t = 0.070/0.033 = 2.12 (OCR dropped leading zeros but same ratio)
  - Any value whose absolute value is between 2.10 and 2.15
  reject:
  - t approximately 2.30 (used 0.301/0.131, wrong coefficient)
  - t approximately 4.24 (used 0.014/0.0033, doubled the numerator)
  - t approximately 21 (used wrong SE such as 0.00033)
  - Any value whose absolute value is not close to 2.12 and cannot be attributed to rounding or OCR error

- id: correct_critical_value
  number: 7
  question: 'C7: Does the student use a critical value of approximately 1.96 for the two-tailed 5% significance test?'
  accept:
  - CV = 1.96
  - plus or minus 1.96
  - Critical value at 5% two-tailed = 1.96
  - Student compares t = 2.12 to 1.96 (implicit use of 1.96)
  reject:
  - REJECT only if the student uses a clearly wrong critical value (e.g. 1.645 for a one-tailed test) AND that wrong value changes their reject/fail-to-reject conclusion.

- id: rejects_null_hypothesis
  number: 8
  question: 'C8: Does the student correctly reject H0 at the 5% significance level?'
  accept:
  - Reject H0 / reject the null.
  - Statistically significant at the 5% level.
  - Absolute value of t = 2.12 > 1.96, so reject.
  - The result is significant; reject the null.
  reject:
  - Student explicitly states fail to reject H0.
  - Student explicitly states cannot reject H0.
  - Student states not statistically significant.
  - Student correctly computes t approximately 2.12 > 1.96 but then explicitly concludes fail to reject.

- id: correct_final_conclusion
  number: 9
  question: 'C9: Does the student conclude (as a final answer) that the marginal effect of firm size on rdintens changes with firm size (is not constant)?'
  accept:
  - The marginal effect changes with firm size.
  - The marginal effect is not constant.
  - rdintens changes with firm size (sales).
  - The coefficient on sales-squared is statistically significant, so the marginal effect varies with firm size.
  reject:
  - Student final statement is that the marginal effect IS constant.
  - Student says the marginal effect does not change with firm size.
  - Student rejects H0 but then writes the marginal effect is constant as the conclusion.

- id: no_wrong_coefficient_test
  number: 10
  question: 'C10: Does the student avoid the error of testing the coefficient on sales (beta1 approx 0.301, SE approx 0.131, t approx 2.30) as their primary test?'
  accept:
  - Student tests beta2 (the sales-squared coefficient) with t approximately 2.12.
  - Student uses 0.0070/0.0033 as the t-statistic.
  reject:
  - REJECT only if the student clearly and primarily uses 0.301/0.131 approximately 2.30 as their t-statistic to decide whether the marginal effect is constant, without also correctly testing beta2.

- id: no_doubled_numerator_error
  number: 11
  question: 'C11: Does the student avoid the error of placing the derivative coefficient 2 times 0.0070 = 0.014 in the numerator of the t-statistic (which yields t approximately 4.24)?'
  accept:
  - t approximately 2.12 (uses 0.0070 as the numerator)
  - Any t-statistic not approximately equal to 4.24 in absolute value
  reject:
  - REJECT only if the student clearly computes 0.014/0.0033 approximately 4.24 as their t-statistic, having placed the derivative coefficient (0.014) rather than the regression coefficient (0.0070) in the numerator.
