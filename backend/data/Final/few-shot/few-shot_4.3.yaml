examples:
- label: full credit
  answer: 'H0: beta_min_fem = 0. Ha: beta_min_fem != 0. The relevant term is the minority*female
    interaction because the question asks whether the female-male evaluation gap changes
    with minority status. t = (-0.2469421 - 0) / 0.1167427 = -2.12, so |t| = 2.12
    > 1.96 at the 5% level. Reject H0. There is statistically significant evidence
    that the difference in average course evaluations between female and male instructors
    depends on minority status.'
  grading:
  - criterion_id: connects_question_to_interaction
    met: true
  - criterion_id: correct_null_no_interaction
    met: true
  - criterion_id: correct_two_sided_alternative
    met: true
  - criterion_id: uses_interaction_regression_row
    met: true
  - criterion_id: correct_t_statistic
    met: true
  - criterion_id: correct_five_percent_rule
    met: true
  - criterion_id: rejects_no_interaction_null
    met: true
  - criterion_id: concludes_evidence_of_dependence
    met: true
  - criterion_id: keeps_requested_scope_clear
    met: true
