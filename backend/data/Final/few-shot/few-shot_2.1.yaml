examples:
- label: full credit
  answer: 'The marginal effect of firm size on rdintens is not constant — it changes
    with firm size. To see why, take the derivative of rdintens with respect to sales:

    d(rdintens)/d(sales) = 0.301 − 2(0.0070)·sales = 0.301 − 0.014·sales

    This expression depends on sales, so the marginal effect is not a constant.


    To test whether the quadratic term is statistically significant:

    H₀: β₂ = 0

    H₁: β₂ ≠ 0

    α = 0.05 → critical value = 1.96 (two-tailed)


    t = −0.0070 / 0.0033 = −2.12


    |−2.12| = 2.12 > 1.96, so we reject H₀ at the 5% significance level.

    The coefficient on sales² is statistically significant. Therefore, the marginal
    effect of firm size on rdintens changes with firm size.'
  grading:
  - criterion_id: marginal_effect_not_constant
    met: true
  - criterion_id: justification_mentions_quadratic_or_derivative
    met: true
  - criterion_id: derivative_retains_sales_variable
    met: true
  - criterion_id: null_hypothesis_targets_beta2
    met: true
  - criterion_id: two_sided_alternative
    met: true
  - criterion_id: t_statistic_approx_2pt12
    met: true
  - criterion_id: correct_critical_value
    met: true
  - criterion_id: rejects_null_hypothesis
    met: true
  - criterion_id: correct_final_conclusion
    met: true
  - criterion_id: no_wrong_coefficient_test
    met: true
  - criterion_id: no_doubled_numerator_error
    met: true
