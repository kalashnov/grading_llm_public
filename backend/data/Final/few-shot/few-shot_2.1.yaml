- label: fails to reject H₀ due to wrong comparison
  answer: 'Marginal effect = d(rdintens)/d(sales) = 0.301 − 2(0.0070)·sales = 0.301
    − 0.014·sales

    It depends on sales, so it should change with firm size.


    H₀: β₂ = 0

    H₁: β₂ ≠ 0


    t = −0.0070 / 0.0033 = −2.12


    CV = 1.96 at 5% significance level.


    Since −2.12 < 1.96, we fail to reject H₀. There is insufficient evidence at the
    5% significance level to conclude the marginal effect changes with firm size.
    The marginal effect is constant.'
